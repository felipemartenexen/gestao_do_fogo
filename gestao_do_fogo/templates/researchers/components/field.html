{% comment %}Campo de formulário com rótulo, ajuda e erros. Espera: field.{% endcomment %}
<div class="form-control w-full">
  <label class="label py-1" for="{{ field.id_for_label }}">
    <span class="label-text">
      {{ field.label }}{% if field.field.required %} <span class="text-error">*</span>{% endif %}
    </span>
  </label>
  {{ field }}
  {% if field.help_text %}
    <p class="text-xs text-base-content/60 mt-1">{{ field.help_text }}</p>
  {% endif %}
  {% for error in field.errors %}
    <p class="text-xs text-error mt-1">{{ error }}</p>
  {% endfor %}
</div>
